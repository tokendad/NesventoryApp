name: Deploy to Play Store

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: play-store-deploy
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Bump version code
        run: |
          # Extract current version code from build.gradle.kts
          current_code=$(grep -oP 'System\.getenv\("VERSION_CODE"\)\?\.toIntOrNull\(\) \?: \K\d+' app/build.gradle.kts)
          new_code=$((current_code + 1))
          
          echo "Current versionCode: $current_code"
          echo "New versionCode: $new_code"
          
          # Update the version code in build.gradle.kts
          sed -i "s/versionCode = (System.getenv(\"VERSION_CODE\")?.toIntOrNull() ?: $current_code)/versionCode = (System.getenv(\"VERSION_CODE\")?.toIntOrNull() ?: $new_code)/" app/build.gradle.kts
          
          # Verify the change was made
          if ! grep -q "?: $new_code)" app/build.gradle.kts; then
            echo "Error: Failed to update version code in build.gradle.kts"
            exit 1
          fi
          
          # Export the new version code for use in subsequent steps
          echo "NEW_VERSION_CODE=$new_code" >> $GITHUB_ENV
          
          # Commit and push the change
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump versionCode to $new_code [skip ci]"
          git push

      - name: Build with Gradle
        run: ./gradlew bundleRelease
        env:
          VERSION_CODE: ${{ env.NEW_VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Release Notes
        run: |
          VERSION=$(cat VERSION)
          mkdir -p distribution/whatsnew
          # Extract everything after the version header until the next version header or end of file
          sed -n "/## \[$VERSION\]/,/## \[/{/## \[$VERSION\]/b; /## \[/q; p}" CHANGELOG.md > /tmp/temp-notes.txt
          # Truncate to 500 characters (Google Play Store limit)
          # If content is longer, truncate at word boundary and add ellipsis
          if [ "$(wc -c < /tmp/temp-notes.txt)" -gt 500 ]; then
            # Use 497 chars (500 - 3 for '...') to stay within limit
            head -c 497 /tmp/temp-notes.txt | sed 's/[[:space:]]*[^[:space:]]*$/.../' > distribution/whatsnew/whatsnew-en-US
          else
            cp /tmp/temp-notes.txt distribution/whatsnew/whatsnew-en-US
          fi

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.tokendad.nesventorynew
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: alpha
          whatsNewDirectory: distribution/whatsnew
